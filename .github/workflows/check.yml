name: Compile check

# Builds a debug APK on every branch except main, so a mistake shows up before anything is merged.
# Nothing is signed, published or released here.
on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Security guard (blocks the build if something dangerous was added)
        run: python3 .github/guard/guard.py
      - name: Check the Gradle wrapper is the official one
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4
      - name: Build a debug APK
        env:
          # The real build refuses to run without the signing key. This check never signs anything, so it skips that rule.
          CI: "false"
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
